name: Test & Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest Pillow && sudo apt-get install -y -q libjpeg-turbo-progs
      - run: pytest -q

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Is this a new version?
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APP=$(python -c "import drone_sorter; print(drone_sorter.__version__)")
          echo "version=$APP" >> "$GITHUB_OUTPUT"
          if gh release view "v$APP" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Get jpegtran (lossless JPG shrinking) from libjpeg-turbo
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET=$(gh release view --repo libjpeg-turbo/libjpeg-turbo --json assets \
                    --jq '.assets[].name' | grep -E '^libjpeg-turbo-.*-vc(-x)?64\.exe$' | head -1)
          echo "Using $ASSET"
          gh release download --repo libjpeg-turbo/libjpeg-turbo --pattern "$ASSET" --dir dl
          7z x "dl/$ASSET" -odl/ljt >/dev/null
          mkdir -p vendor/jpegtran
          cp "$(find dl/ljt -iname jpegtran.exe | head -1)" vendor/jpegtran/
          find dl/ljt -ipath '*bin*' -iname '*.dll' -exec cp {} vendor/jpegtran/ \;
          ls -la vendor/jpegtran
          vendor/jpegtran/jpegtran.exe -version
      - name: Test shrinking on Windows
        shell: bash
        run: |
          pip install pytest
          export DRONE_SORTER_JPEGTRAN="$(cygpath -w "$PWD/vendor/jpegtran/jpegtran.exe")"
          python -c "from drone_sorter import shrink; assert shrink.is_available(), 'jpegtran not found'"
          pytest -q tests/test_shrink.py
      - name: Build single-file exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name DronePitchSorter
          --collect-all tkinterdnd2
          --collect-all sv_ttk
          --add-binary "vendor/jpegtran/*;jpegtran"
          main.py
      - uses: actions/upload-artifact@v4
        with:
          name: DronePitchSorter-windows
          path: dist/DronePitchSorter.exe
      - name: Publish GitHub Release (when the version number went up)
        if: steps.ver.outputs.new == 'true' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Drone Pitch Sorter ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/DronePitchSorter.exe
          generate_release_notes: true
          make_latest: true
